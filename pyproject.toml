[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ehr-media-intelligence"
version = "1.0.0"
description = "Synthetic EHR media ingestion, FHIR R4 normalization, grounded summaries and semantic search"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "fhir.resources>=8,<9", "sentence-transformers>=3.4,<6", "faiss-cpu>=1.10,<2",
  "numpy>=1.26,<3", "httpx>=0.27,<1", "jsonschema>=4.23,<5",
  "python-dotenv>=1,<2", "openai>=2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["ehr_media"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a downloaded embedding model"]

